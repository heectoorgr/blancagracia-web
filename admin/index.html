<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración · Blanca Graciá</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#17252a;--muted:#657579;--accent:#c45d45;--line:#dce5e3;--paper:#fffdf9;--bg:#e8eeec}
  *{box-sizing:border-box}
  body{margin:0;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--bg)}
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{width:100%;max-width:320px;padding:32px;background:var(--paper);border:1px solid var(--line);border-radius:8px;text-align:center}
  .gate-card h1{font-size:20px;margin:0 0 18px}
  .gate-card input{width:100%;padding:12px;font-size:18px;text-align:center;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;letter-spacing:2px}
  .gate-card button, .save-bar button{padding:12px 20px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:700 14px "DM Sans",sans-serif;cursor:pointer}
  .gate-error{color:var(--accent);font-size:13px;min-height:18px}
  #panel{display:none;max-width:820px;margin:0 auto;padding:24px 20px 100px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin:36px 0 16px}
  section:first-of-type h2{margin-top:0}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input[type=text],input[type=email],input[type=url],textarea{width:100%;padding:10px;font:14px "DM Sans",sans-serif;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:#fff;color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  .entry{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fff}
  .entry-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .entry-row strong{font-size:12px;color:var(--muted)}
  .remove-btn{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:13px}
  .add-btn{border:1px dashed var(--accent);background:transparent;color:var(--accent);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  .photo-preview{width:120px;height:120px;object-fit:cover;border-radius:6px;display:block;margin-bottom:8px;background:#eee}
  .save-bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;max-width:820px;margin:0 auto}
  #status{font-size:13px}
  #status.ok{color:#2a7d4f}
  #status.err{color:var(--accent)}
  @media (max-width: 480px) {
    #panel{padding:16px 14px 90px}
    h2{font-size:13px;margin:28px 0 12px}
    .entry{padding:12px}
    .photo-preview{width:96px;height:96px}
    input[type=text],input[type=email],input[type=url],textarea{font-size:16px}
    .save-bar{padding:12px 14px;flex-wrap:wrap}
    #status{width:100%}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Panel de Blanca Graciá</h1>
    <input id="codeInput" type="password" inputmode="numeric" placeholder="Código de acceso" autofocus>
    <button id="enterBtn" type="button">Entrar</button>
    <p class="gate-error" id="gateError"></p>
  </div>
</div>

<div id="panel">
  <section id="section-bio">
    <h2>Biografía</h2>
    <label>Párrafos del texto</label>
    <div id="bioParagraphs"></div>
    <button class="add-btn" type="button" data-add="bioParagraph">+ Añadir párrafo</button>
    <label style="margin-top:18px">Fotos de la biografía</label>
    <div id="bioPhotos"></div>
    <button class="add-btn" type="button" data-add="bioPhoto">+ Añadir foto</button>
  </section>

  <section id="section-agenda">
    <h2>Agenda</h2>
    <label>Enlace de "Mira mi agenda" (Notion)</label>
    <input id="scheduleUrl" type="url">
    <label style="margin-top:18px">Próximos eventos</label>
    <div id="upcomingList"></div>
    <button class="add-btn" type="button" data-add="upcoming">+ Añadir evento próximo</button>
    <label style="margin-top:18px">Eventos anteriores</label>
    <div id="previousList"></div>
    <button class="add-btn" type="button" data-add="previous">+ Añadir evento anterior</button>
  </section>

  <section id="section-social">
    <h2>Redes sociales</h2>
    <label>Instagram</label>
    <input id="socialInstagram" type="url">
    <label>LinkedIn</label>
    <input id="socialLinkedin" type="url">
    <label>YouTube</label>
    <input id="socialYoutube" type="url">
  </section>

  <section id="section-auditions">
    <h2>Audiciones (vídeos de YouTube)</h2>
    <p style="font-size:12px;color:var(--muted);margin-top:-8px">Pega el enlace completo del vídeo. La miniatura se genera sola.</p>
    <div id="auditionsList"></div>
    <button class="add-btn" type="button" data-add="audition">+ Añadir audición</button>
  </section>

  <section id="section-gallery">
    <h2>Galería de fotos (apartado Media)</h2>
    <div id="galleryList"></div>
    <button class="add-btn" type="button" data-add="galleryPhoto">+ Añadir foto</button>
  </section>

  <section id="section-contact">
    <h2>Contacto</h2>
    <label>Texto de introducción</label>
    <textarea id="contactIntro"></textarea>
    <label>Email de contacto</label>
    <input id="contactEmail" type="email">
  </section>
</div>

<div class="save-bar" id="saveBar" style="display:none">
  <button id="saveBtn" type="button">Guardar y publicar</button>
  <span id="status"></span>
</div>

<script>
let ACCESS_CODE = '';

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function sanitizeName(name) {
  return name.toLowerCase().replace(/[^a-z0-9._-]/g, '-');
}

function toImageUrl(path) {
  if (!path) return '';
  return '/' + path.split('/').map(encodeURIComponent).join('/');
}

function makeRemovable(container, entry) {
  const row = document.createElement('div');
  row.className = 'entry-row';
  row.innerHTML = '<strong></strong><button type="button" class="remove-btn">Eliminar ✕</button>';
  row.querySelector('.remove-btn').addEventListener('click', () => entry.remove());
  entry.prepend(row);
}

function addBioParagraph(text = '') {
  const wrap = document.createElement('div');
  wrap.className = 'entry';
  wrap.innerHTML = '<textarea class="bio-paragraph"></textarea>';
  wrap.querySelector('textarea').value = text;
  makeRemovable(null, wrap);
  document.getElementById('bioParagraphs').append(wrap);
}

function addPhotoEntry(container, currentPath) {
  const wrap = document.createElement('div');
  wrap.className = 'entry';
  wrap.dataset.currentPath = currentPath || '';
  wrap.innerHTML = '<img class="photo-preview">' +
    '<input type="file" accept="image/*" class="photo-input">';
  const img = wrap.querySelector('img');
  img.src = toImageUrl(currentPath);
  wrap.querySelector('.photo-input').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const dataBase64 = await fileToBase64(file);
    const finalPath = 'images/uploads/' + Date.now() + '-' + sanitizeName(file.name);
    wrap.dataset.currentPath = finalPath;
    wrap._pendingImage = { path: finalPath, dataBase64 };
    img.src = URL.createObjectURL(file);
  });
  makeRemovable(null, wrap);
  container.append(wrap);
}

function addUpcomingEntry(item = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'entry';
  wrap.innerHTML =
    '<label>Enlace (opcional)</label><input type="url" class="f-link">' +
    '<label>Tipo de trabajo</label><input type="text" class="f-type">' +
    '<label>Fecha o fechas</label><input type="text" class="f-date">' +
    '<label>Lugar</label><input type="text" class="f-place">' +
    '<label>Descripción</label><textarea class="f-description"></textarea>';
  wrap.querySelector('.f-link').value = item.link || '';
  wrap.querySelector('.f-type').value = item.type || '';
  wrap.querySelector('.f-date').value = item.date || '';
  wrap.querySelector('.f-place').value = item.place || '';
  wrap.querySelector('.f-description').value = item.description || '';
  makeRemovable(null, wrap);
  document.getElementById('upcomingList').append(wrap);
}

function addPreviousEntry(item = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'entry';
  wrap.innerHTML =
    '<label>Fecha</label><input type="text" class="f-date">' +
    '<label>Nombre del evento</label><input type="text" class="f-name">' +
    '<label>Lugar</label><input type="text" class="f-place">' +
    '<label>Descripción breve</label><textarea class="f-description"></textarea>';
  wrap.querySelector('.f-date').value = item.date || '';
  wrap.querySelector('.f-name').value = item.name || '';
  wrap.querySelector('.f-place').value = item.place || '';
  wrap.querySelector('.f-description').value = item.description || '';
  makeRemovable(null, wrap);
  document.getElementById('previousList').append(wrap);
}

function addAuditionEntry(item = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'entry';
  wrap.innerHTML =
    '<label>Título</label><input type="text" class="f-title">' +
    '<label>Enlace de YouTube</label><input type="url" class="f-url">';
  wrap.querySelector('.f-title').value = item.title || '';
  wrap.querySelector('.f-url').value = item.youtubeUrl || '';
  makeRemovable(null, wrap);
  document.getElementById('auditionsList').append(wrap);
}

function addGalleryEntry(item = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'entry';
  wrap.dataset.currentPath = item.image || '';
  wrap.innerHTML = '<img class="photo-preview">' +
    '<input type="file" accept="image/*" class="photo-input">' +
    '<label>Descripción de la foto</label><input type="text" class="f-alt">';
  wrap.querySelector('img').src = toImageUrl(item.image);
  wrap.querySelector('.f-alt').value = item.alt || '';
  wrap.querySelector('.photo-input').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const dataBase64 = await fileToBase64(file);
    const finalPath = 'images/uploads/' + Date.now() + '-' + sanitizeName(file.name);
    wrap.dataset.currentPath = finalPath;
    wrap._pendingImage = { path: finalPath, dataBase64 };
    wrap.querySelector('img').src = URL.createObjectURL(file);
  });
  makeRemovable(null, wrap);
  document.getElementById('galleryList').append(wrap);
}

function renderContent(content) {
  (content.bio?.paragraphs || []).forEach(addBioParagraph);
  (content.bio?.photos || []).forEach((path) => addPhotoEntry(document.getElementById('bioPhotos'), path));
  document.getElementById('scheduleUrl').value = content.agenda?.scheduleUrl || '';
  (content.agenda?.upcoming || []).forEach(addUpcomingEntry);
  (content.agenda?.previous || []).forEach(addPreviousEntry);
  document.getElementById('socialInstagram').value = content.social?.instagram || '';
  document.getElementById('socialLinkedin').value = content.social?.linkedin || '';
  document.getElementById('socialYoutube').value = content.social?.youtube || '';
  (content.auditions || []).forEach(addAuditionEntry);
  (content.gallery || []).forEach(addGalleryEntry);
  document.getElementById('contactIntro').value = content.contact?.intro || '';
  document.getElementById('contactEmail').value = content.contact?.email || '';
}

function collectContent() {
  const bioParagraphs = [...document.querySelectorAll('#bioParagraphs .bio-paragraph')].map((el) => el.value).filter(Boolean);
  const bioPhotos = [...document.querySelectorAll('#bioPhotos .entry')].map((el) => el.dataset.currentPath).filter(Boolean);
  const upcoming = [...document.querySelectorAll('#upcomingList .entry')].map((el) => ({
    link: el.querySelector('.f-link').value,
    type: el.querySelector('.f-type').value,
    date: el.querySelector('.f-date').value,
    place: el.querySelector('.f-place').value,
    description: el.querySelector('.f-description').value
  }));
  const previous = [...document.querySelectorAll('#previousList .entry')].map((el) => ({
    date: el.querySelector('.f-date').value,
    name: el.querySelector('.f-name').value,
    place: el.querySelector('.f-place').value,
    description: el.querySelector('.f-description').value
  }));
  const auditions = [...document.querySelectorAll('#auditionsList .entry')].map((el) => ({
    title: el.querySelector('.f-title').value,
    youtubeUrl: el.querySelector('.f-url').value
  }));
  const gallery = [...document.querySelectorAll('#galleryList .entry')].map((el) => ({
    image: el.dataset.currentPath,
    alt: el.querySelector('.f-alt').value
  }));
  const images = [];
  document.querySelectorAll('#bioPhotos .entry, #galleryList .entry').forEach((el) => {
    if (el._pendingImage) images.push(el._pendingImage);
  });

  const content = {
    bio: { paragraphs: bioParagraphs, photos: bioPhotos },
    agenda: {
      scheduleUrl: document.getElementById('scheduleUrl').value,
      upcoming,
      previous
    },
    social: {
      instagram: document.getElementById('socialInstagram').value,
      linkedin: document.getElementById('socialLinkedin').value,
      youtube: document.getElementById('socialYoutube').value
    },
    auditions,
    gallery,
    contact: {
      intro: document.getElementById('contactIntro').value,
      email: document.getElementById('contactEmail').value
    }
  };

  return { content, images };
}

document.querySelectorAll('[data-add]').forEach((button) => {
  button.addEventListener('click', () => {
    const type = button.dataset.add;
    if (type === 'bioParagraph') addBioParagraph();
    if (type === 'bioPhoto') addPhotoEntry(document.getElementById('bioPhotos'), '');
    if (type === 'upcoming') addUpcomingEntry();
    if (type === 'previous') addPreviousEntry();
    if (type === 'audition') addAuditionEntry();
    if (type === 'galleryPhoto') addGalleryEntry();
  });
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  statusEl.className = '';
  statusEl.textContent = 'Guardando...';
  const { content, images } = collectContent();
  try {
    const res = await fetch('/.netlify/functions/save-content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: ACCESS_CODE, content, images })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error desconocido');
    statusEl.className = 'ok';
    statusEl.textContent = 'Guardado. La web se actualizará en 1-2 minutos.';
  } catch (error) {
    statusEl.className = 'err';
    statusEl.textContent = 'No se pudo guardar: ' + error.message;
  }
});

async function unlock(code) {
  const res = await fetch('/content.json', { cache: 'no-store' });
  const content = await res.json();
  ACCESS_CODE = code;
  sessionStorage.setItem('adminCode', code);
  renderContent(content);
  document.getElementById('gate').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('saveBar').style.display = 'flex';
}

document.getElementById('enterBtn').addEventListener('click', () => {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) {
    document.getElementById('gateError').textContent = 'Escribe el código de acceso.';
    return;
  }
  unlock(code);
});
document.getElementById('codeInput').addEventListener('keydown', (event) => {
  if (event.key === 'Enter') document.getElementById('enterBtn').click();
});

const savedCode = sessionStorage.getItem('adminCode');
if (savedCode) unlock(savedCode);
</script>
</body>
</html>
