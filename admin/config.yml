backend:
  name: git-gateway
  branch: main

# Las fotos nuevas que subas desde el panel se guardan aquí:
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "es"

collections:
  - name: "contenido"
    label: "Contenido de la web"
    files:
      - file: "content.json"
        label: "Editar la web"
        name: "contenido"
        fields:
          - label: "Biografía (Sobre mí)"
            name: "bio"
            widget: "object"
            fields:
              - label: "Párrafos del texto"
                name: "paragraphs"
                widget: "list"
                label_singular: "Párrafo"
                summary: "{{fields.text}}"
                field: { label: "Párrafo", name: "text", widget: "text" }
              - label: "Fotos de la biografía"
                name: "photos"
                hint: "Sube la foto desde tu dispositivo con el botón. El fundido/recorte de la sección se aplica solo."
                widget: "list"
                label_singular: "Foto"
                field: { label: "Foto", name: "image", widget: "image" }

          - label: "Agenda"
            name: "agenda"
            widget: "object"
            fields:
              - label: "Próximos eventos"
                name: "upcoming"
                widget: "list"
                label_singular: "Evento próximo"
                summary: "{{fields.type}} · {{fields.date}}"
                fields:
                  - { label: "Enlace (opcional)", name: "link", widget: "string", required: false, hint: "Enlace a más información sobre el evento, si lo hay" }
                  - { label: "Tipo de trabajo", name: "type", widget: "string" }
                  - { label: "Fecha o fechas", name: "date", widget: "string" }
                  - { label: "Lugar", name: "place", widget: "string" }
                  - { label: "Descripción", name: "description", widget: "text" }
              - label: "Eventos anteriores"
                name: "previous"
                widget: "list"
                label_singular: "Evento anterior"
                summary: "{{fields.name}} · {{fields.date}}"
                fields:
                  - { label: "Fecha", name: "date", widget: "string" }
                  - { label: "Nombre del evento", name: "name", widget: "string" }
                  - { label: "Lugar", name: "place", widget: "string" }
                  - { label: "Descripción breve", name: "description", widget: "text" }

          - label: "Redes sociales"
            name: "social"
            widget: "object"
            hint: "Pega aquí el enlace de tu perfil. Al pulsar el logo en la web se abrirá ese enlace."
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }

          - label: "Audiciones (vídeos de YouTube)"
            name: "auditions"
            widget: "list"
            label_singular: "Audición"
            summary: "{{fields.title}}"
            hint: "Pega el enlace completo del vídeo de YouTube. La miniatura se genera sola, no hace falta subir ninguna imagen."
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Enlace de YouTube", name: "youtubeUrl", widget: "string" }

          - label: "Galería de fotos (apartado Media)"
            name: "gallery"
            widget: "list"
            label_singular: "Foto"
            summary: "{{fields.alt}}"
            hint: "Sube la foto desde tu dispositivo. Mantiene el mismo estilo y fundido que las demás fotos de esta galería."
            fields:
              - { label: "Foto", name: "image", widget: "image" }
              - { label: "Descripción de la foto", name: "alt", widget: "string", required: false }

          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Texto de introducción", name: "intro", widget: "text" }
              - { label: "Email de contacto", name: "email", widget: "string" }
